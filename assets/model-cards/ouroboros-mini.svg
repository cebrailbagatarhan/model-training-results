<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Ouroboros summary"><rect width="1200" height="675" fill="#fdf8ff"/><rect x="28" y="28" width="1144" height="619" rx="22" fill="#ffffff" stroke="#edd9ff"/><text x="60" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#7e22ce">Ouroboros-Mini — deneysel GRPO kaydı</text><text x="60" y="132" font-family="Arial" font-size="22" fill="#915fbf">Qwen2.5-1.5B base · epistemik-bütünlük odaklı mini RL deneyi</text><rect x="60" y="170" width="460" height="205" rx="18" fill="#fcf8ff" stroke="#edd9ff"/><text x="85" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#7e22ce">Kayıtlı sonuçlar</text><text x="85" y="255" font-family="Arial" font-size="25" fill="#5d348e">200 step mini GRPO koşusu</text><text x="85" y="290" font-family="Arial" font-size="25" fill="#5d348e">Baskılı: %70 · Baskısız: %65</text><text x="85" y="325" font-family="Arial" font-size="25" fill="#5d348e">EIS: 0.950</text><text x="85" y="360" font-family="Arial" font-size="25" fill="#5d348e">Kaynak: çalıştırılmış Colab notebook</text><rect x="550" y="170" width="590" height="205" rx="18" fill="#fffdff" stroke="#edd9ff"/><text x="575" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#7e22ce">Dikkat edilmesi gerekenler</text><text x="575" y="255" font-family="Arial" font-size="25" fill="#5d348e">• Deney “experimental” olarak tutuldu.</text><text x="575" y="290" font-family="Arial" font-size="25" fill="#5d348e">• Notebook provenance ve veri boyutu çıktıları tutarsız.</text><text x="575" y="325" font-family="Arial" font-size="25" fill="#5d348e">• Temiz tekrar yapılmadan güçlü kalite iddiası kurulmaz.</text><rect x="60" y="420" width="1080" height="175" rx="18" fill="#fcf8ff" stroke="#edd9ff"/><text x="85" y="460" font-family="Arial" font-size="28" font-weight="700" fill="#7e22ce">Özet</text><text x="85" y="500" font-family="Arial" font-size="25" fill="#5d348e">Bu kayıt, ilginç bir fikir denemesini koruyor; sonuçları tamamen çöpe atmıyor ama güvenilirlik</text><text x="85" y="535" font-family="Arial" font-size="25" fill="#5d348e">etiketiyle beraber yayınlıyor. Amaç: öğrenilenleri kaybetmeden dürüst belgeleme yapmak.</text></svg>