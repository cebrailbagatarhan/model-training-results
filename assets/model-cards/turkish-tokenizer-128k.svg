<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Tokenizer summary"><rect width="1200" height="675" fill="#f7fffb"/><rect x="28" y="28" width="1144" height="619" rx="22" fill="#ffffff" stroke="#d9f7e7"/><text x="60" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#15803d">Turkish BPE Tokenizer 128k — eğitim özeti</text><text x="60" y="132" font-family="Arial" font-size="22" fill="#4b8d64">Türkçe Byte-Level BPE tokenizer · yaklaşık 150k Wikipedia makalesi</text><rect x="60" y="170" width="480" height="205" rx="18" fill="#f8fffb" stroke="#d9f7e7"/><text x="85" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#15803d">Ne üretildi?</text><text x="85" y="255" font-family="Arial" font-size="50" font-weight="800" fill="#15803d">128k vocab</text><text x="85" y="295" font-family="Arial" font-size="25" fill="#3c6b4d">Türkçe odaklı tokenizer eğitimi</text><text x="85" y="330" font-family="Arial" font-size="25" fill="#3c6b4d">Benchmark sonucu değil, altyapı bileşeni</text><rect x="570" y="170" width="570" height="205" rx="18" fill="#fbfffd" stroke="#d9f7e7"/><text x="595" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#15803d">Nasıl okunmalı?</text><text x="595" y="255" font-family="Arial" font-size="25" fill="#3c6b4d">• Bu kayıt performans kıyasından çok veri ön-işleme varlığıdır.</text><text x="595" y="290" font-family="Arial" font-size="25" fill="#3c6b4d">• Yine de gelecekteki Türkçe LLM deneyleri için önemli temel parçadır.</text><text x="595" y="325" font-family="Arial" font-size="25" fill="#3c6b4d">• Sonuç deposunda tokenizer’ı ayrı bileşen olarak izliyoruz.</text><rect x="60" y="420" width="1080" height="170" rx="18" fill="#f8fffb" stroke="#d9f7e7"/><text x="85" y="460" font-family="Arial" font-size="28" font-weight="700" fill="#15803d">Özet</text><text x="85" y="500" font-family="Arial" font-size="25" fill="#3c6b4d">Buradaki amaç sadece son model sayılarını değil, modeli mümkün kılan tokenizer ve veri bileşenlerini de</text><text x="85" y="535" font-family="Arial" font-size="25" fill="#3c6b4d">aynı arşivde görünür kılmak.</text></svg>