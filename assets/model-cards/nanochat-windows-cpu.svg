<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="nanochat summary"><rect width="1200" height="675" fill="#f7fbff"/><rect x="28" y="28" width="1144" height="619" rx="22" fill="#ffffff" stroke="#d7ebff"/><text x="60" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#0f4c81">nanochat Windows CPU — self-reported sonuç</text><text x="60" y="132" font-family="Arial" font-size="22" fill="#4c7192">Windows CPU odaklı yerel eğitim denemeleri · 17M / 61M / 92M presetler</text><rect x="60" y="170" width="500" height="205" rx="18" fill="#f8fcff" stroke="#d7ebff"/><text x="85" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#0f4c81">README’de bildirilen sonuç</text><text x="85" y="255" font-family="Arial" font-size="46" font-weight="800" fill="#0f4c81">Loss 5.79 → 2.37</text><text x="85" y="295" font-family="Arial" font-size="25" fill="#355a7d">“medium” preset için kullanıcı raporu</text><text x="85" y="330" font-family="Arial" font-size="25" fill="#355a7d">Amaç: CPU üzerinde eğitim yapılabildiğini göstermek</text><rect x="590" y="170" width="550" height="205" rx="18" fill="#fbfeff" stroke="#d7ebff"/><text x="615" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#0f4c81">Güvenilirlik notu</text><text x="615" y="255" font-family="Arial" font-size="25" fill="#355a7d">• Ham log / ayrı doğrulama henüz yok.</text><text x="615" y="290" font-family="Arial" font-size="25" fill="#355a7d">• Bu yüzden sonuç “self-reported” olarak etiketlendi.</text><text x="615" y="325" font-family="Arial" font-size="25" fill="#355a7d">• Yine de proje yönü ve deney fikri korunuyor.</text><rect x="60" y="420" width="1080" height="170" rx="18" fill="#f8fcff" stroke="#d7ebff"/><text x="85" y="460" font-family="Arial" font-size="28" font-weight="700" fill="#0f4c81">Özet</text><text x="85" y="500" font-family="Arial" font-size="25" fill="#355a7d">Bu kart, doğrulanmış benchmark ile README bazlı kullanıcı raporunu ayırmak için eklendi.</text><text x="85" y="535" font-family="Arial" font-size="25" fill="#355a7d">Amaç abartmadan belgeleme: ilginç sonuç var, fakat kanıt seviyesi sınırlı.</text></svg>