<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Car evaluation summary"><rect width="1200" height="675" fill="#fffbf7"/><rect x="28" y="28" width="1144" height="619" rx="22" fill="#ffffff" stroke="#ffe5cc"/><text x="60" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#b45309">Car Evaluation ML — klasik model karşılaştırması</text><text x="60" y="132" font-family="Arial" font-size="22" fill="#94613b">UCI Car Evaluation · 7 model · 80/20 split + 5-fold CV</text><rect x="60" y="170" width="480" height="195" rx="18" fill="#fffaf4" stroke="#ffe5cc"/><text x="85" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#b45309">En iyi sonuç</text><text x="85" y="255" font-family="Arial" font-size="50" font-weight="800" fill="#b45309">Decision Tree</text><text x="85" y="295" font-family="Arial" font-size="42" font-weight="700" fill="#0f766e">%98.55 test accuracy</text><text x="85" y="330" font-family="Arial" font-size="24" fill="#7a5837">Tamamlanmış, doğrulanmış karşılaştırma</text><rect x="570" y="170" width="570" height="195" rx="18" fill="#fffdf9" stroke="#ffe5cc"/><text x="595" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#b45309">Ne yaptık?</text><text x="595" y="252" font-family="Arial" font-size="25" fill="#7a5837">• Logistic Regression, SVM, KNN, Naive Bayes,</text><text x="615" y="284" font-family="Arial" font-size="25" fill="#7a5837">Random Forest, Decision Tree ve XGBoost benzeri</text><text x="615" y="316" font-family="Arial" font-size="25" fill="#7a5837">karşılaştırmalı klasik ML akışı raporlandı.</text><rect x="60" y="405" width="1080" height="195" rx="18" fill="#fffaf4" stroke="#ffe5cc"/><text x="85" y="445" font-family="Arial" font-size="28" font-weight="700" fill="#b45309">Kısa çıkarım</text><text x="85" y="485" font-family="Arial" font-size="25" fill="#7a5837">Bu repo sadece LLM değil; daha küçük ve net sonuçlu ML deneylerini de aynı şeffaflıkla arşivliyor.</text><text x="85" y="520" font-family="Arial" font-size="25" fill="#7a5837">Böylece farklı ölçeklerde “ne denendi, ne işe yaradı?” sorusu tek yerde görülebiliyor.</text></svg>