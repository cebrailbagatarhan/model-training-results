<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="ModernLLM summary"><rect width="1200" height="675" fill="#fff9f2"/><rect x="28" y="28" width="1144" height="619" rx="22" fill="#ffffff" stroke="#ffe2bd"/><text x="60" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#c26a00">ModernLLM-Large 1.129B — kısmi H100 kayıtları</text><text x="60" y="132" font-family="Arial" font-size="22" fill="#9b6b2d">Decoder-only Transformer · RMSNorm · RoPE · GQA · SwiGLU · Flash Attention</text><rect x="60" y="170" width="470" height="210" rx="18" fill="#fffaf4" stroke="#ffe2bd"/><text x="85" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#c26a00">Model kartı</text><text x="85" y="255" font-family="Arial" font-size="25" fill="#7a531f">Parametre: 1,129,416,704</text><text x="85" y="290" font-family="Arial" font-size="25" fill="#7a531f">Evreler: pretrain + sft + cot</text><text x="85" y="325" font-family="Arial" font-size="25" fill="#7a531f">Donanım: H100</text><text x="85" y="360" font-family="Arial" font-size="25" fill="#7a531f">Artefakt: model.pt ~4.52 GB</text><rect x="560" y="170" width="580" height="210" rx="18" fill="#fffdf8" stroke="#ffe2bd"/><text x="585" y="212" font-family="Arial" font-size="28" font-weight="700" fill="#c26a00">Durum ve yorum</text><text x="585" y="255" font-family="Arial" font-size="25" fill="#7a531f">• Çalıştırılmış denemeler var fakat final benchmark temiz değil.</text><text x="585" y="290" font-family="Arial" font-size="25" fill="#7a531f">• Bu nedenle sonuç “partial” olarak etiketlendi.</text><text x="585" y="325" font-family="Arial" font-size="25" fill="#7a531f">• Ama model artefaktı ve mimari bilgisi doğrulandı.</text><rect x="60" y="415" width="1080" height="185" rx="18" fill="#fffaf4" stroke="#ffe2bd"/><text x="85" y="455" font-family="Arial" font-size="28" font-weight="700" fill="#c26a00">Neden önemli?</text><text x="85" y="495" font-family="Arial" font-size="25" fill="#7a531f">Kaynaklar sadece “model var” demiyor; hangi mimari bileşenlerin kullanıldığını ve koşunun</text><text x="85" y="530" font-family="Arial" font-size="25" fill="#7a531f">tam mı kısmi mi olduğunu açıkça ayırıyor. Sonuç deposunda bu model için güvenilirlik etiketi var.</text></svg>